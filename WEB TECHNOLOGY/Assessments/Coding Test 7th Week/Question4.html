<!DOCTYPE html>
<html>
<head>
<style>
table, td
   {
  border: 1px solid teal;
  border-collapse: collapse;
  padding: 30px;
   }

tr:nth-child(odd) 
 {
  display: none;
   }
</style>
</head>
<body>
<h3>Table where all the Odd Rows are Hidden !!!</h3>
<table>
     <tr><td>Row 1</td></tr>
    <tr><td>Row 2</td></tr>
    <tr><td>Row 3</td></tr>
   <tr><td>Row 4</td></tr>
   <tr><td>Row 5</td></tr>
</table>
</body>
</html>
